name: Fix typography

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve typography
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif': 'font:16px/1.6 Arial,"Noto Sans Devanagari","Noto Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility',
              'letter-spacing:-.07em;font-size:20px': 'letter-spacing:-.02em;font-size:20px',
              'letter-spacing:-.08em;max-width:1080px': 'letter-spacing:-.035em;max-width:1080px',
              'line-height:1.12;letter-spacing:-.045em;font-weight:900': 'line-height:1.2;letter-spacing:-.02em;font-weight:850',
              'line-height:.94;letter-spacing:-.065em': 'line-height:1.08;letter-spacing:-.025em',
              'line-height:1;letter-spacing:-.055em;font-weight:950': 'line-height:1.08;letter-spacing:-.02em;font-weight:850',
              'letter-spacing:-.09em;margin-top:12px': 'letter-spacing:-.02em;margin-top:12px',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          marker = '</style>'
          lang_css = '''html[lang="mr"],html[lang="hi"]{font-family:"Noto Sans Devanagari","Noto Sans",Arial,system-ui,sans-serif}html[lang="mr"] h1,html[lang="hi"] h1,html[lang="mr"] h2,html[lang="hi"] h2,html[lang="mr"] .manifesto,html[lang="hi"] .manifesto,html[lang="mr"] .quote,html[lang="hi"] .quote{letter-spacing:normal;line-height:1.18}html[lang="mr"] .eyebrow,html[lang="hi"] .eyebrow,html[lang="mr"] .kicker,html[lang="hi"] .kicker{letter-spacing:.06em;line-height:1.4}html[lang="mr"] .card h3,html[lang="hi"] .card h3{line-height:1.35}'''
          if lang_css not in s:
              s = s.replace(marker, lang_css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit typography fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix multilingual typography spacing"
          git push
